 const term=p.tradeTerm||s.tradeTerm||'FOB_SZ', note=exp?label('taxNoteExport')+' · '+(bilingual?bi(term):t(term)):label('taxNoteDomestic');
 if(!s.dealer)return row('unitRange',money(p.unit))+row(totalKey,money(p.total),'grand')+(exp?row('tradeTerm',bilingual?bi(term):t(term)):'')+row('lead',p.lead+' '+label('days'))+`<p class="muted" style="margin-top:8px">${note}</p>`+lockRow(!bilingual);
 const vatLabel=exp?label('vatNA'):(pct(p.vatRate!=null?p.vatRate:effectiveVatRate(s,r))+' · '+money(p.vat));
 return [['base',p.base],['colorAdd',p.color],['buckleAdd',p.buckle],['finishAdd',p.finish],['logoAdd',p.logo],['packAdd',p.pack]].map(([k,v])=>row(k,money(v))).join('')+row('tier',pct(p.tier))+row('applied',pct(p.discount))+row('unit',money(p.unit))+row('qty',s.qty+' '+label('pcs'))+row('subtotal',money(p.subtotal))+'<div class="rule"></div>'+[['mold',p.mold],['logoFee',p.logoFee],['packFee',p.packFee],['complianceFee',p.compliance],['pretax',p.pretax]].map(([k,v])=>row(k,money(v))).join('')+row('vat',vatLabel)+'<div class="rule"></div>'+row(totalKey,money(p.total),'grand')+(exp?row('tradeTerm',bilingual?bi(term):t(term)):'')+row('lead',p.lead+' '+label('days'))+`<p class="muted" style="margin-top:8px">${note}</p>`;
}
function live(){listCard();const p=calcPrice();if($('breakdown'))$('breakdown').innerHTML=breakdown(p);if($('tiers'))$('tiers').innerHTML=PRICE_RULES.tiers.map(x=>`<div class="tier ${x.discount===p.tier?'active':''}">${x.min}+<b>−${pct(x.discount)}</b></div>`).join('');if($('manualValue'))$('manualValue').textContent=pct(state.manual);if($('moqNotice'))$('moqNotice').innerHTML=state.qty<PRICE_RULES.models[state.model].moq?`<div class="notice">${t('underMoq')} · ${t('sales')}<br><button id="fixMoq">${t('fixMoq')}</button></div>`:'';if($('salesNotice'))$('salesNotice').innerHTML=`<div class="notice ${p.needsSales?'':'good'}"><b>${t(p.needsSales?'sales':'standard')}</b>${p.needsSales?'<br>'+p.reasons.map(t).join(' · '):''}</div>`;footer();}
function footer(){const p=calcPrice();$('footer').hidden=state.tab!=='config';const exp=p.export, labelKey=exp?(state.dealer?'exportTotal':'exportRange'):(state.dealer?'total':'range');$('footer').innerHTML=`<div class="row"><small>${t(labelKey)} · ${state.currency}${exp?' · '+t(state.tradeTerm||'FOB_SZ'):''}</small><small>${t('lead')} ${p.lead} ${t('days')}</small></div><div class="price" aria-live="polite">${price(p.total)}</div><div class="two"><button id="addLine">${t('addLine')}</button><button class="primary" id="generate">${t('generate')} <span aria-hidden="true">↗</span></button></div>`;}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function generate(){if(!state.lines.length&&$('qty')&&!validQuantity($('qty').value)){ $('qty').focus();return;}const now=new Date(),until=new Date(now);until.setDate(until.getDate()+PRICE_RULES.quoteValidityDays);const s=structuredClone(state),r=structuredClone(PRICE_RULES),lines=s.lines.length?s.lines:[currentLine()],p=calcQuote(lines,s,r);s.lines=structuredClone(lines);quote={id:'DOOSSY-Q-'+localDate(now).replaceAll('-','')+'-'+String(Math.floor(Math.random()*10000)).padStart(4,'0'),date:localDate(now),until:localDate(until),s,r,p,status:p.approval?'approvalRequired':'noApproval',confirmed:false,serial:++quoteSerial,revision};switchTab('quote');}
function quotePage(){if(!quote){$('quotePage').innerHTML=`<div class="empty"><div class="symbol">▤</div><h2>${t('emptyTitle')}</h2><p class="muted">${t('emptyBody')}</p><button class="primary" data-tab="config">${t('back')}</button></div>`;return;}const q=quote,{s,r,p}=q;
 const canConfirm=s.dealer&&!p.needsSales&&(!p.approval||q.status==='approved');
 $('quotePage').innerHTML=`<div class="card"><div class="print-warning">示例数据，价格非真实 / Sample data, not real prices</div><div class="quotehead"><div class="row"><div class="wordmark">DOO<span>SSY</span></div><span class="tag">${bi('quote')}</span></div><h2>QUOTATION</h2><p>东莞市多思穿戴技术有限公司<br>Dongguan Doossy Wearable Tech Co., Ltd<br>doossycn.com</p><p style="margin-top:10px">${bi('quoteNo')}<br><b>${q.id}</b></p></div><div class="quote-meta">${[['customer',bi(s.dealer?'dealer':'visitor')],['region',bi(s.region)],['date',q.date],['validity',q.until]].map(([k,v])=>`<div class="muted">${bi(k)}<strong>${v}</strong></div>`).join('')}</div><div class="badge ${q.status==='pending'||q.status==='approvalRequired'?'amber':''}">${bi(q.status)}</div>${p.export?`<div class="badge" style="margin-left:6px">${bi(p.tradeTerm||'FOB_SZ')} · ${bi('exportNote')}</div>`:`<div class="badge" style="margin-left:6px">${bi('domesticNote')}</div>`}${p.needsSales?`<div class="notice"><b>${bi('sales')}</b><br>${p.lines.map((item,i)=>item.needsSales?`${i+1}. ${esc(s.lines[i].model)}: ${item.reasons.map(bi).join(' · ')}`:'').filter(Boolean).join('<br>')}</div>`:''}<div class="tablewrap" style="margin-top:14px"><table class="items"><thead><tr><th>No.</th><th>SKU / ${bi('model')}</th><th>${bi('qty')}</th><th>${bi(s.dealer?'unit':'unitRange')}</th>${s.dealer?`<th>${bi('setup')}</th>`:''}<th>${bi('lineTotal')}</th></tr></thead><tbody>${s.lines.map((line,i)=>{const item=p.lines[i];return `<tr><td>${i+1}</td><td><b>${esc(line.model)}</b>${line.material==='lsr'?'<br>'+bi('demoSKU'):''}<br>${bi(line.material)} · ${bi(line.size)}<br>${bi(line.color)}<br>${bi(line.buckle)} · ${bi(line.finish)}<br>${bi('logo')}: ${bi(line.logo)}<br>${bi('packaging')}: ${bi(line.packaging)}${s.dealer?`<details class="line-details"><summary>${bi('breakdown')}</summary>${[['base',item.base],['colorAdd',item.color],['buckleAdd',item.buckle],['finishAdd',item.finish],['logoAdd',item.logo],['packAdd',item.pack],['mold',item.mold],['logoFee',item.logoFee],['packFee',item.packFee]].map(([k,v])=>`${bi(k)}: ${cash(v,state.currency,r)}<br>`).join('')}${bi('tier')}: ${pct(item.tier)}<br>${bi('applied')}: ${pct(item.discount)}</details>`:''}</td><td>${line.qty}</td><td>${price(item.unit,s,r)}</td>${s.dealer?`<td>${cash(item.setup,state.currency,r)}</td>`:''}<td>${price(item.total,s,r)}</td></tr>`;}).join('')}</tbody></table></div><h3 style="margin:18px 0 10px">${bi('breakdown')}</h3><div class="breakdown">${s.dealer?[['subtotal',p.subtotal],['setup',p.setup],['complianceFee',p.compliance],['pretax',p.pretax]].map(([k,v])=>`<div class="row"><span>${bi(k)}</span><span>${cash(v,state.currency,r)}</span></div>`).join('')+`<div class="row"><span>${bi('vat')}${p.export?'':(' · '+pct(p.vatRate))}</span><span>${p.export?bi('vatNA'):cash(p.vat,state.currency,r)}</span></div>`:lockRow()}<div class="rule"></div><div class="row grand"><span>${bi(p.export?(s.dealer?'exportTotal':'exportRange'):(s.dealer?'total':'totalRange'))} · CNY</span><span>${price(p.total,s,r,'CNY')}</span></div><div class="row grand"><span>USD</span><span>${price(p.total,s,r,'USD')}</span></div>${p.export?`<div class="row"><span>${bi('tradeTerm')}</span><span>${bi(p.tradeTerm||'FOB_SZ')}</span></div><p class="muted">${bi('exportNote')}</p>`:`<p class="muted">${bi('domesticNote')}</p>`}<div class="row"><span>${bi('lead')}</span><span>${p.lead} ${bi('days')}</span></div></div><p class="muted">${bi('fx')}: 1 USD = ${r.fxRate.toFixed(4)} CNY</p><div class="quote-notes"><b>${bi('notes')}</b><br>${bi('leadNote')}<br>${['EU','US','UK'].includes(s.region)&&s.compliance?bi('complianceNote'):bi('testNone')}<br>${p.export?bi('taxNoteExport'):bi('taxNoteDomestic')}<br>${bi('snapshot')}</div><div class="badge no-print ${q.status==='pending'||q.status==='approvalRequired'?'amber':''}" style="margin-top:12px" id="approvalBadge">${bi('approvalStatus')}: ${bi(q.status)}</div><div class="actions"><button id="print">${t('print')}</button><button id="approve" ${!p.approval||q.status==='pending'||q.status==='approved'?'disabled':''}>${t('approve')}</button></div><button class="primary wide no-print" id="confirm" ${!canConfirm||q.confirmed?'disabled':''}>${t(q.confirmed?'confirmed':'confirm')}</button>${!canConfirm?`<p class="muted no-print" style="margin-top:8px">${t(p.needsSales?'sales':!s.dealer?'needLogin':'needsApproval')}</p>`:''}</div>`;
}
const originalRules=structuredClone(PRICE_RULES);
function validateRules(r){function walk(value,template){if(typeof template==='number'){if(typeof value!=='number'||!Number.isFinite(value)||value<0||value>1e9)throw Error();}else if(Array.isArray(template)){if(!Array.isArray(value)||!value.length)throw Error();if(typeof template[0]==='string'){if(value.some(x=>!Object.hasOwn(SIZES,x))||new Set(value).size!==value.length)throw Error();}else value.forEach(x=>walk(x,template[0]));}else if(typeof template==='object'){if(!value||Array.isArray(value)||typeof value!=='object'||Object.keys(value).length!==Object.keys(template).length)throw Error();for(const k of Object.keys(template)){if(!Object.hasOwn(value,k))throw Error();walk(value[k],template[k]);}}else if(value!==template)throw Error();}walk(r,originalRules);
 if(r.vatByRegion){for(const [k,v] of Object.entries(r.vatByRegion)){if(typeof v!=='number'||v<0||v>1)throw Error();}
 if(typeof r.vatByRegion.China==='number')r.vatRate=r.vatByRegion.China;}
 if(r.exportWhenCurrencyUSD!==0&&r.exportWhenCurrencyUSD!==1)throw Error();
 if(r.fxRate<=0||r.fxRate>100000||r.vatRate>1||r.visitorRangePct>=1||r.approvalDiscountThreshold>1||r.manualDiscountMax>0.2||!Number.isInteger(r.quantityMax)||r.quantityMax<1||r.quantityMax>1000000||!Number.isInteger(r.quoteValidityDays)||r.quoteValidityDays<1||r.quoteValidityDays>3650||!Number.isInteger(r.leadExtraCustom)||r.tiers[0].min!==0)throw Error();
 for(const m of Object.values(r.models)){if(!Number.isInteger(m.moq)||m.moq<1||m.moq>r.quantityMax||m.unitMult<=0)throw Error();}for(const m of Object.values(r.materials))if(!Number.isInteger(m.leadDays))throw Error();
 r.tiers.forEach((x,i)=>{if(!Number.isInteger(x.min)||x.discount>=1||(i&&(x.min<=r.tiers[i-1].min||x.discount<r.tiers[i-1].discount)))throw Error();});return r;
}
function applyRules(r){validateRules(r);PRICE_RULES=r;state.manual=Math.min(state.manual,r.manualDiscountMax);state.qty=Math.min(state.qty,r.quantityMax);revision++;header();config();quotePage();adminPage();$('adminMessage').textContent=t('saved');}
function adminPage(){ $('adminPage').innerHTML=`<h2>${t('admin')}</h2><p class="adminintro muted">${t('rulesInfo')}<br>${t('rulesNote')}<br>vatByRegion / exportWhenCurrencyUSD / 贸易条款 FOB·EXW 可配置。</p><div class="card"><table><tbody>${[['fxRate','fx'],['vatRate','rate'],['approvalDiscountThreshold','approvalThreshold'],['quoteValidityDays','validDays']].map(([k,l])=>`<tr><td><label for="rule-${k}">${t(l)}${['vatRate','approvalDiscountThreshold'].includes(k)?' (0–1)':''}</label></td><td><input id="rule-${k}" data-rule="${k}" type="number" step="${k==='quoteValidityDays'?'1':'0.01'}" value="${PRICE_RULES[k]}"></td></tr>`).join('')}</tbody></table><p class="muted" style="margin-top:12px">${t('material')} · CNY / ${t('pcs')}</p><table><tbody>${Object.entries(PRICE_RULES.materials).map(([k,v])=>`<tr><td>${t(k)}</td><td>${cash(v.baseUnitCNY,'CNY')}</td><td>${v.leadDays} ${t('days')}</td></tr>`).join('')}</tbody></table><details open><summary>${t('editJson')}</summary><textarea id="rulesJson" spellcheck="false" aria-label="${t('editJson')}">${esc(JSON.stringify(PRICE_RULES,null,2))}</textarea><button class="primary wide" style="margin-top:10px" id="applyRules">${t('apply')}</button></details><p id="adminMessage" role="status" class="error"></p></div>`;}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';header();config();quotePage();adminPage();showTab();}
function showTab(){['config','quote','admin'].forEach(x=>$(x+'Page').hidden=x!==state.tab);footer();}
function switchTab(tab){state.tab=tab;header();showTab();if(tab==='quote')quotePage();$('scroll').scrollTop=0;}
function validQuantity(value){const n=Number(value);return value!==''&&Number.isSafeInteger(n)&&n>0&&n<=PRICE_RULES.quantityMax;}
function setSelection(field,value){state[field]=value;if(field==='material'){state.model=Object.keys(PRICE_RULES.models).find(k=>PRICE_RULES.models[k].material===value);if(![...STANDARD_COLORS[value],'custom'].includes(state.color))state.color=STANDARD_COLORS[value][0];}if(field==='material'||field==='model'){const m=PRICE_RULES.models[state.model];state.material=m.material;if(!m.sizes.includes(state.size))state.size=m.sizes[0];state.qty=Math.max(state.qty,m.moq);}if(field==='region'&&!['EU','US','UK'].includes(value))state.compliance=false;revision++;config();}
function approvalModal(){ $('dialogTitle').textContent=t('approvalTitle');$('dialogText').textContent=t(quote.status==='approved'?'approvalDone':'approvalBody');$('closeDialog').textContent=t('close');}
function approve(){if(!quote||!quote.p.approval||['pending','approved'].includes(quote.status))return;const target=quote;target.status='pending';quotePage();approvalModal();$('approvalDialog').showModal();clearTimeout(approvalTimer);approvalTimer=setTimeout(()=>{target.status='approved';if(quote===target){quotePage();approvalModal();}},1500);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.lang){state.lang=b.dataset.lang;render();}else if(b.dataset.currency){state.currency=b.dataset.currency;render();}else if(b.hasAttribute('data-login')){state.dealer=!state.dealer;revision++;config();}else if(b.dataset.remove!==undefined){state.lines.splice(Number(b.dataset.remove),1);revision++;header();listCard();footer();}else if(b.dataset.tab)switchTab(b.dataset.tab);else if(b.dataset.field)setSelection(b.dataset.field,b.dataset.value);else switch(b.id){case'login':state.dealer=!state.dealer;revision++;config();break;case'fixMoq':state.qty=PRICE_RULES.models[state.model].moq;revision++;config();break;case'addLine':addLine();break;case'clearList':state.lines.length=0;revision++;header();listCard();footer();break;case'generate':generate();break;case'print':window.print();break;case'approve':approve();break;case'closeDialog':$('approvalDialog').close();break;case'confirm':if(quote&&quote.s.dealer&&!quote.p.needsSales&&(!quote.p.approval||quote.status==='approved')){quote.confirmed=true;quotePage();}break;case'applyRules':try{applyRules(JSON.parse($('rulesJson').value));}catch{$('adminMessage').textContent=t('invalid');}break;}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='qty'){const ok=validQuantity(el.value);el.setCustomValidity(ok?'':t('qtyInvalid'));$('qtyError').textContent=ok?'':t('qtyInvalid');if(ok){state.qty=Number(el.value);revision++;live();}else {$('generate').disabled=!state.lines.length;$('addLine').disabled=true;}}if(el.id==='manual'){state.manual=Number(el.value)/100;revision++;live();}if(el.id==='fxInput'){const n=Number(el.value);const ok=Number.isFinite(n)&&n>0&&n<=100000;el.setCustomValidity(ok?'':t('fxInvalid'));if(ok){PRICE_RULES.fxRate=n;revision++;live();quotePage();adminPage();}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.select)setSelection(el.dataset.select,el.value);if(el.id==='compliance'){state.compliance=el.checked;revision++;live();}if(el.dataset.rule){try{const r=structuredClone(PRICE_RULES);r[el.dataset.rule]=Number(el.value);if(el.value==='')throw Error();applyRules(r);}catch{$('adminMessage').textContent=t('invalid');}}if(el.id==='fxInput'&&!el.checkValidity()){el.reportValidity();el.value=PRICE_RULES.fxRate;el.setCustomValidity('');}});
window.__demo={calcLine,calcQuote,calcPrice,get rules(){return PRICE_RULES},state};
render();
</script>
