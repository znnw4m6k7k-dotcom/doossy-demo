<style>
:root{--ink:#233957;--muted:#78869b;--line:#e1e7ef;--blue:#1f5fbf;--side:#f2f5fa;--banner-height:38px}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{touch-action:manipulation}button{cursor:pointer;border:1px solid #d2dce8;border-radius:6px;background:#fff;color:var(--ink);padding:8px 14px;transition:background .15s}button:hover{background:#edf3fc;border-color:#7f9ec8}button:disabled{cursor:default;opacity:.65}button.primary{color:white;background:var(--blue);border-color:var(--blue)}button.small{padding:4px 10px;font-size:12px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8eb8f5;outline-offset:3px}input,select,textarea{width:100%;min-width:0;border:1px solid #cfd9e5;border-radius:6px;padding:9px 10px;background:white;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #9cbbec}input[readonly],input:disabled{background:#f5f7fa}label{display:block;margin-bottom:6px}h1{font-size:36px;line-height:1.25;margin:24px 0 12px;letter-spacing:-1px}h2{font-size:23px;margin:24px 0 13px;line-height:1.4}h3{font-size:18px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:var(--muted);font-size:12px}.banner{position:fixed;z-index:50;top:0;left:0;right:0;min-height:38px;padding:8px 16px;text-align:center;background:#e9f1fd;color:#254d83;border-bottom:1px solid #d5e2f3;font-size:12px;line-height:21px}.sidebar{position:fixed;left:0;top:var(--banner-height);bottom:0;width:260px;background:var(--side);padding:25px 24px;overflow-y:auto}.sidebar nav{display:grid;gap:4px;margin:4px 0 25px;border-bottom:1px solid #d0dae7;padding-bottom:24px}.sidebar nav a{text-decoration:none;color:#5e708a;padding:7px 10px;border-radius:5px;font-size:14px}.sidebar nav a.active{background:#d8e5f5;color:#173d70;font-weight:700}.brand{font-size:21px;font-weight:750;line-height:1.5;margin-bottom:8px}.role-card,.card,.metric{border:1px solid var(--line);border-radius:9px;background:white;padding:17px;box-shadow:0 2px 7px #19345705}.role-card{margin:15px 0}.sidebar .muted{margin:13px 0}.sidebar select{border-color:#7095cb}.sidebar footer{margin-top:30px}.mobile-toggle{display:none}main{margin-left:260px;padding:30px clamp(24px,4.8vw,80px) 60px;padding-top:calc(var(--banner-height) + 30px);min-width:0}.page-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.badge{display:inline-block;color:white;border-radius:999px;padding:2px 9px;font-size:11px;line-height:1.65;white-space:nowrap}.L1,.current,.offline{background:#2e9d5b}.L2{background:#1f5fbf}.L3,.obsolete{background:#e08a00}.L4{background:#d64545}.identity{margin:14px 0 20px;color:var(--muted);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.metric{border-top:3px solid var(--blue);padding:14px}.metric span{font-size:13px}.metric-value{font-size:28px;font-weight:750;margin-top:7px;color:#334155}.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px;margin:22px 0 30px}.charts h2{margin-top:0}.vertical-chart{height:240px;display:flex;align-items:stretch;gap:14px;padding:15px 8px 25px 25px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 47px,#e9edf4 48px)}.v-column{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.v-bar{width:90%;max-width:45px;background:var(--blue);border-radius:3px 3px 0 0;position:relative;min-height:2px}.v-bar span{position:absolute;top:-23px;left:0;right:0;text-align:center;font-size:11px;color:#5e708a}.v-label{position:absolute;bottom:-25px;font-size:11px;white-space:nowrap}.horizontal-chart{height:240px;overflow:auto;padding:4px 0}.h-row{display:grid;grid-template-columns:70px 1fr 20px;align-items:center;gap:6px;font-size:10px;margin:3px 0}.h-row span:first-child{text-align:right}.h-bar{background:var(--blue);height:9px;border-radius:0 3px 3px 0}.card{margin:18px 0}.card h2:first-child{margin-top:0}.table-wrap{width:100%;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:6px;margin:12px 0;overscroll-behavior-x:contain}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left;white-space:nowrap}th{background:#f7f9fc;font-weight:500;color:#78869b}td,th{padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid #edf0f5}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f4f8fe}tr.highlight{background:#fff4d6}tr.highlight td:first-child{border-left:4px solid #e08a00}.notice{padding:13px 16px;border-radius:6px;margin:13px 0;background:#edf5ff;color:#24588b;overflow-wrap:anywhere}.notice.success{background:#e8f8ef;color:#237847}.notice.warning{background:#fff7df;color:#8b5c10}.notice.error{background:#fdecec;color:#b52f36}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:15px 0}.toolbar>label{flex:1;min-width:130px;margin:0}.toolbar .keyword{flex:2}.check{display:flex;align-items:center;gap:7px;margin:14px 0}.check input{width:auto}.tabs{display:flex;border-bottom:1px solid var(--line);margin:24px 0 18px;gap:20px}.tabs button{border:0;border-radius:0;background:none;padding:10px 2px}.tabs button.selected{border-bottom:3px solid var(--blue);color:var(--blue);font-weight:650}.question-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.question-grid button{text-align:left;white-space:normal;overflow-wrap:anywhere;padding:13px}.question-grid small{display:block;margin-top:5px}.chat-user{margin:22px 0 12px 10%;padding:14px 18px;border-radius:10px;background:#edf3fc}.chat-answer{padding:18px;border:1px solid var(--line);border-radius:10px;margin-bottom:20px}.answer{line-height:1.9;overflow-wrap:anywhere}.answer ul,.answer ol{padding-left:25px;margin:8px 0}.answer p{margin:8px 0}.answer-meta{margin:12px 0;color:var(--muted);font-size:11px}.citation{margin:10px 0}.citation summary{line-height:1.8}.citation .meta{display:block;color:var(--muted);font-size:12px;margin-top:5px}details{border:1px solid var(--line);border-radius:6px;margin:14px 0;padding:12px 15px;min-width:0}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;background:#f6f8fb;padding:13px;border-radius:5px;max-height:400px;overflow:auto}.tree{white-space:pre;overflow:auto}.progress{height:10px;background:#e6edf7;border-radius:9px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--blue);transition:width .12s}.findings li{margin:10px 0}.findings ul{padding-left:20px}.finding-special{background:#fff3d0;padding:10px;border-left:3px solid #e08a00;border-radius:3px}.toast{position:fixed;z-index:80;bottom:18px;right:18px;max-width:min(600px,calc(100vw - 36px));box-shadow:0 6px 25px #18375824}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:12px;padding:25px;max-width:550px;width:calc(100% - 30px);max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#13263b70}dialog textarea{min-height:110px}.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.empty{text-align:center;padding:30px;color:var(--muted)}.loading{padding:30px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1500px){main{max-width:1700px}.charts{gap:40px}}@media(max-width:1050px){.sidebar{width:230px;padding:20px 18px}main{margin-left:230px;padding-left:24px;padding-right:24px}.page-banner{align-items:flex-start;flex-direction:column;gap:7px}.charts{gap:14px}.vertical-chart{gap:8px;padding-left:8px}.metric{padding:12px}.metric span{font-size:12px}}
@media(max-width:760px){body{font-size:14px}.banner{padding:6px 10px;font-size:11px;line-height:18px}.sidebar{position:relative;top:auto;bottom:auto;width:100%;padding:10px 16px;margin-top:var(--banner-height);overflow:visible}.mobile-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;padding:6px 0;font-weight:700}.sidebar-content{display:none;padding-top:12px}.sidebar.open .sidebar-content{display:block}.sidebar nav{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 18px;padding-bottom:15px}.sidebar .brand{font-size:18px}.sidebar footer{margin-top:15px}main{margin-left:0;padding:20px 16px 40px}.page-banner{gap:8px;font-size:11px}h1{font-size:30px;margin-top:20px}h2{font-size:21px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric-value{font-size:25px}.charts{grid-template-columns:1fr;gap:25px}.vertical-chart{height:215px}.horizontal-chart{height:auto}.h-row{font-size:12px;grid-template-columns:85px 1fr 25px;margin:7px 0}.h-bar{height:11px}.question-grid{grid-template-columns:1fr}.toolbar{gap:10px}.toolbar>label{min-width:calc(50% - 10px)}.toolbar .keyword{flex-basis:100%}.chat-answer{padding:12px}.chat-user{margin-left:5%}.card{padding:13px}.offline{font-size:10px}.identity{margin-bottom:16px}}
</style>

<body>
<div class="banner" data-testid="demo-banner">在线演示版 · 示例数据 · 正式版在客户本地服务器离线运行，AI 问答为预录结果</div>
<aside class="sidebar" id="sidebar"><button class="mobile-toggle" id="mobile-toggle" aria-expanded="false" aria-controls="sidebar-content">☰ 导航与演示身份 <span id="mobile-role">总经理</span></button><div class="sidebar-content" id="sidebar-content"></div></aside>
<main id="main"><div class="loading" role="status">正在读取示例数据…</div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="apply-dialog" aria-labelledby="apply-title"><form id="apply-form"><div class="dialog-top"><h2 id="apply-title">申请查看资料</h2><button type="button" data-action="close-dialog" aria-label="关闭弹窗">✕</button></div><div id="apply-info"></div><label for="apply-reason">申请原因</label><textarea id="apply-reason" placeholder="请说明查阅此资料的工作需要" required></textarea><div class="toolbar"><button type="submit" class="primary" data-testid="apply-submit">提交申请</button><button type="button" data-action="close-dialog">取消</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='archive-online-demo-v3', pages={dashboard:'📊 数据看板',import:'📥 导入/归档',search:'🔎 AI 检索问答',approvals:'✅ 审批中心',audit:'📋 审计日志'}, colors={L1:'#2e9d5b',L2:'#1f5fbf',L3:'#e08a00',L4:'#d64545'};
const fresh=()=>({role:'总经理',requests:[],audit:[],imported:false});
let state=fresh(),data,qa=[],docs=[],history=[],tab='ai',notice='',importRun=null,animation=null,toastTimer,modalDoc=null,modalQuestion='',auditGuard='',storageWarning=false;
let filters={keyword:'',dept:'',doc_type:'',level:'',latest:true},auditFilters={action:'',role:''};
try{const stored=JSON.parse(sessionStorage.getItem(KEY)||'null');if(stored&&Array.isArray(stored.requests)&&Array.isArray(stored.audit))state={...fresh(),...stored};}catch{}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(state));}catch{if(!storageWarning){storageWarning=true;toast('浏览器无法保存会话，当前演示仍可使用；刷新后会话状态将重置。','warning');}}}
function now(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
const roleRule=(role=state.role)=>data.roles[role]||{}, docById=id=>docs.find(d=>String(d.id)===String(id)), allAudit=()=>[...data.audit,...state.audit].sort((a,b)=>Number(b.id)-Number(a.id));
function log(action,target='',detail='',result='成功',role=state.role){const id=Math.max(0,...data.audit.map(a=>Number(a.id)),...state.audit.map(a=>Number(a.id)))+1;state.audit.push({id,ts:now(),role,dept:roleRule(role).dept,user_name:data.user_names[role]||role,action,target:String(target),detail:typeof detail==='object'?JSON.stringify(detail):String(detail),result});save();}
function hasGrant(d,role=state.role){return state.requests.some(r=>r.requester_role===role&&r.requester_dept===roleRule(role).dept&&String(r.doc_id)===String(d.id)&&r.status==='已通过');}
function canAccess(d,role=state.role){if(!d)return false;const r=roleRule(role),depts=r[d.level.toLowerCase()+'_depts']||[];return (r.levels_all||[]).includes(d.level)||depts==='all'||depts.includes(d.dept)||hasGrant(d,role);}
function canDownload(d,role=state.role){return canAccess(d,role)&&(d.level!=='L4'||!!roleRule(role).l4_download);}
function canApprove(d,role=state.role){const a=roleRule(role).can_approve||[];return a.includes('all')||a.includes(d.level)||a.includes(`${d.level}:${d.dept}`);}
const approver=d=>d.level==='L4'?(['工程','工程部'].includes(d.dept)?'工程经理':'总经理'):'部门主管（工程经理）或总经理';
const denial=d=>`该资料为 ${d.level} ${data.levels[d.level]}（${d.doc_type}），你当前的权限不能查看。如确有需要，可点击「申请查看」通过企业微信提交查阅申请，由${approver(d)}审批。`;
function scope(r){const full=Object.keys(data.levels).filter(l=>(r.levels_all||[]).includes(l)||r[l.toLowerCase()+'_depts']==='all');if(full.length===4)return '全部密级';const parts=[full.length<=2?full.map(l=>l+' '+data.levels[l]).join('、'):full[0]+'–'+full.at(-1)+' 全部'];for(const l of ['L3','L4']){const d=r[l.toLowerCase()+'_depts'];if(d&&d!=='all'&&d.length)parts.push(l+' 限'+d.join('/')+(l==='L4'&&!r.l4_download?'部（仅在线查看）':''));}return parts.join('；');}
const badge=l=>`<span class="badge ${Object.hasOwn(colors,l)?l:''}">${esc(l)} ${esc(data.levels[l]||'')}</span>`, rev=r=>/^[A-Za-z]$/.test(r||'')?'Rev '+r:r||'未标注';
function status(d){return ({现行:'🟢 现行',旧版本:'🟠 旧版本（已作废）',重复:'⚪ 重复（完全相同）',近似重复:'🟡 近似重复'}[d.status]||d.status)+(d.status==='近似重复'&&!d.is_latest?' · 已作废':'');}
function relation(d){const out=[];if(d.duplicate_of){const x=docById(d.duplicate_of);out.push('与 '+(canAccess(x)?x.original_name:'受限文件（需审批）')+(d.status==='重复'?' 完全相同':' 为同版导出件'));}if(d.superseded_by){const x=docById(d.superseded_by);out.push('被 '+(canAccess(x)?rev(x.revision):'受限现行版')+' 取代');}return out.join('；');}
function plainTable(headers,rows){return `<div class="table-wrap" tabindex="0"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div>`;}
const columns=[['id','编号'],['original_name','原文件名'],['_arrow','→'],['archived_name','归档后名称'],['dept','部门'],['doc_no','文件编号'],['doc_type','类型'],['level','密级'],['part_number','料号'],['revision','版本'],['doc_date','日期'],['status','状态'],['_relation','版本关系'],['classify_source','分类来源']];
function docTable(rows){return `<div class="table-wrap" tabindex="0"><table><thead><tr>${columns.map(c=>`<th scope="col">${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(d=>`<tr${d.status==='近似重复'?' class="highlight"':''}>${columns.map(([k])=>{if(!canAccess(d)&&!['status','doc_type','level','dept'].includes(k))return '<td>🔒 受限</td>';return '<td>'+ (k==='level'?badge(d.level):esc(k==='_arrow'?'→':k==='status'?status(d):k==='_relation'?relation(d):k==='revision'?rev(d.revision):d[k]))+'</td>';}).join('')}</tr>`).join('')||`<tr><td colspan="14" class="empty">暂无文件</td></tr>`}</tbody></table></div>`;}
function metrics(items){const icons=['📁','✅','📋','🕘','🔒','🔎','⛔','📨'];return '<div class="metrics">'+items.map(([k,v],i)=>`<div class="metric"${k.includes('L4')?' style="border-top-color:#d64545"':''}><span>${icons[i%8]} ${esc(k)}</span><div class="metric-value">${esc(v)}</div></div>`).join('')+'</div>';}
function auditTable(rows,limited=false){return plainTable(limited?['时间','操作','结果']:['编号','时间','角色','部门','姓名','操作','对象','详情','结果'],rows.map(a=>limited?[a.ts,a.action,(a.result==='拒绝'?'⛔ ':'✅ ')+a.result]:[a.id,a.ts,a.role,a.dept,a.user_name,a.action,a.target,typeof a.detail==='object'?JSON.stringify(a.detail):a.detail,(a.result==='拒绝'?'⛔ ':'✅ ')+a.result]));}
function route(){return Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'dashboard';}
function sidebar(){const r=roleRule();$('#sidebar-content').innerHTML=`<nav aria-label="主要导航">${Object.entries(pages).map(([k,v])=>`<a href="#${k}" data-testid="nav-${k}"${route()===k?' class="active" aria-current="page"':''}>${v}</a>`).join('')}</nav><div class="brand">企业文件智能归档系统</div><p class="muted">演示版 v3 · 在线演示（示例数据）</p><label for="role-select">角色</label><select id="role-select" data-testid="role-select">${Object.keys(data.roles).map(r=>`<option${r===state.role?' selected':''}>${esc(r)}</option>`).join('')}</select><p class="muted">所属部门：${esc(r.dept)}</p><div class="role-card"><strong>${esc(data.user_names[state.role])} · ${esc(r.dept)}部</strong><br>可查看范围<br>${esc(scope(r))}</div><p class="muted">正式版：对话模型 qwen3:8b · 嵌入模型 bge-m3 · 本机运行</p><p class="muted">演示身份切换用于展示权限策略（正式版为企业微信扫码登录）</p><footer><button class="small" data-action="reset">重置演示</button><p class="muted">会话状态仅保存在当前浏览器标签页</p></footer>`;$('#mobile-role').textContent=state.role;}
function header(p){return `<div class="page-banner"><div>企业文件智能归档系统 · 演示版<br><strong>示例表带科技有限公司（虚构示例数据）</strong></div><span class="badge offline">● 正式版本机离线运行 · 数据不出厂</span></div><h1>${esc(pages[p].split(' ').slice(1).join(' '))}</h1><p class="muted">安全归档 · 精准检索 · 权限可控</p><div class="identity">当前身份：${esc(state.role)} · ${esc(state.role==='总经理'?'全部门':roleRule().dept+'部')}</div>`;}
function render(){if(!data)return;stopTyping();sidebar();const p=route();if(p==='audit'&&!roleRule().can_view_audit){const key=p+state.role;if(auditGuard!==key){log('拒绝访问','审计日志','无权限查看审计日志','拒绝');auditGuard=key;}}else auditGuard='';$('#main').innerHTML=header(p)+({dashboard:dashboard,import:importPage,search:searchPage,approvals:approvalsPage,audit:auditPage}[p])();}
function chart(field){const counts={};for(const d of docs.filter(d=>d.status!=='重复'))counts[d[field]]=(counts[d[field]]||0)+1;const entries=field==='level'?Object.keys(colors).map(k=>[k,counts[k]||0]):Object.entries(counts).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));if(field==='doc_type')return '<div class="horizontal-chart" role="img" aria-label="按文件类型统计">'+entries.map(([k,v])=>`<div class="h-row"><span>${esc(k)}</span><div class="h-bar" style="width:${v/max*100}%"></div><span>${v}</span></div>`).join('')+'</div>';return '<div class="vertical-chart" role="img" aria-label="文件数量统计">'+entries.map(([k,v])=>`<div class="v-column"><div class="v-bar" style="height:${v/max*88}%;background:${colors[k]||colors.L2}"><span>${v}</span></div><span class="v-label">${esc(k)}</span></div>`).join('')+'</div>';}
const count=s=>docs.filter(d=>d.status===s).length;
function dashboard(){const audit=allAudit(),limited=!roleRule().can_view_audit;return metrics([['文件总数',docs.length],['已归档',count('现行')],['重复文件',count('重复')],['旧版本',count('旧版本')],['L3/L4 机密文件数',docs.filter(d=>['L3','L4'].includes(d.level)&&d.status!=='重复').length],['今日检索次数',state.audit.filter(a=>a.action==='检索').length],['拒绝访问次数',audit.filter(a=>a.action==='拒绝访问').length],['待审批',state.requests.filter(r=>r.status==='待审批').length]])+`<div class="charts">${[['dept','部门'],['level','密级'],['doc_type','文件类型']].map(([k,v])=>`<section><h2>按${v}</h2>${chart(k)}</section>`).join('')}</div><section class="card"><h2>版本与重复治理</h2>${['重复','近似重复','旧版本'].map(s=>{const rows=docs.filter(d=>d.status===s),visible=rows.filter(d=>canAccess(d));return `<p>${s}：${rows.length} 份</p>${visible.length?plainTable(['原文件名','状态','版本关系'],visible.map(d=>[d.original_name,status(d),relation(d)])):''}${visible.length<rows.length?`<p class="muted">另有 ${rows.length-visible.length} 份受限资料，需审批后查看</p>`:''}`;}).join('')}</section><h2>系统状态</h2><div class="notice success">正式版：所有模型与数据均在客户本地服务器；本页为在线演示，不连接任何模型</div><h2>最近动态</h2>${limited?'<p class="muted">当前角色仅显示本角色的时间、操作与结果。</p>':''}${auditTable(audit.filter(a=>!limited||a.role===state.role).slice(0,10),limited)}`;}
function safeName(d){return canAccess(d)?d.original_name:'受限文件';}
function findings(){const near=docs.filter(d=>d.status==='近似重复'),duplicates=docs.filter(d=>d.status==='重复'),old=docs.filter(d=>d.status==='旧版本'&&d.superseded_by);return `<section class="card findings"><h3>本次导入发现</h3>${near.map(d=>`<p class="finding-special"><strong>${esc(safeName(d))}</strong>${canAccess(d)?`：${d.original_name.includes('最终版')?'名字叫“最终版”，':''}OCR 读出图框版本实为 ${esc(rev(d.revision))}`:''} → ${esc(status(d))}；${esc(relation(d))}</p>`).join('')}<ul>${duplicates.map(d=>`<li>${esc(safeName(d))}：SHA-256 完全重复；${esc(relation(d))}</li>`).join('')}${old.map(d=>{const next=docById(d.superseded_by);return `<li>旧版本链：${esc(safeName(d))}${canAccess(d)?'（'+esc(rev(d.revision))+'）':''} → ${esc(next?safeName(next):'受限文件')}${canAccess(next)?'（'+esc(rev(next.revision))+'）':''}</li>`;}).join('')}</ul></section>`;}
function archiveTree(){const root=new Map();for(const d of docs.filter(d=>canAccess(d))){const parts=d.archived_path.split('/');if(parts.shift()!=='归档库')continue;let n=root;for(const p of parts){if(!n.has(p))n.set(p,new Map());n=n.get(p);}}const lines=['归档库/'];function walk(node,prefix){const entries=[...node.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-CN'));entries.forEach(([name,children],i)=>{const last=i===entries.length-1;lines.push(prefix+(last?'└── ':'├── ')+name+(children.size?'/':''));walk(children,prefix+(last?'    ':'│   '));});}walk(root,'');return lines.join('\n');}
function importPage(){const done=state.imported&&!importRun;return `<label for="folder">收件文件夹路径</label><input id="folder" readonly value="samples/files（${docs.length} 份虚构样例）"><div class="toolbar"><button class="primary" data-testid="import-btn" data-action="import"${importRun?' disabled':''}>${importRun?'正在扫描并归档…':'扫描并归档'}</button><span class="muted">真实导入过程回放 · 约 8 秒</span></div>${importRun?`<div class="progress" role="progressbar" aria-label="导入进度" aria-valuemin="0" aria-valuemax="${docs.length}" aria-valuenow="${importRun.i}"><div style="width:${importRun.i/docs.length*100}%"></div></div><p id="progress-text">${esc(progressText())}</p>`:''}${done?`<div class="notice success">归档回放完成</div>${metrics([['本次导入',docs.length],['新归档',docs.filter(d=>['现行','旧版本','近似重复'].includes(d.status)).length],['重复',count('重复')],['近似重复',count('近似重复')],['旧版本',docs.filter(d=>!d.is_latest&&d.status!=='重复').length],['耗时（秒）',data.elapsed]])}<p class="muted">耗时为演示机实测；页面按真实进度时间轴压缩回放。</p>`:''}${!done&&!importRun?'<h2>当前归档库</h2><p class="muted">演示数据已预先归档，可点击按钮回放导入过程</p>':''}${findings()}<div id="import-results">${docTable(importRun?docs.slice(0,importRun.i):docs)}</div><details><summary>📁 归档库目录结构</summary><pre class="tree">${esc(archiveTree())}</pre></details><details><summary>✏️ 手动修正密级（主管/总经理）</summary><p class="muted">在线演示版只读。正式版由具备权限的主管或总经理修正密级，并同步归档文件名与检索索引。</p></details>`;}
function progressText(){const p=importRun?.point;if(!p)return `0/${docs.length} · 准备导入`;const d=docs.find(d=>d.original_name===p.name);return `${p.i}/${p.total} · ${d?safeName(d):p.name}`;}
function startImport(){if(importRun)return;const points=[...data.progress].sort((a,b)=>a.t-b.t),duration=Math.max(Number(data.elapsed),...points.map(p=>Number(p.t)),.001);importRun={start:performance.now(),i:0,point:null,timer:null};render();const tick=()=>{if(!importRun)return;const elapsed=(performance.now()-importRun.start)/8000*duration;let p=points[0];for(const x of points){if(x.t<=elapsed)p=x;else break;}const changed=importRun.i!==p.i;importRun.i=Math.min(docs.length,Math.max(0,p.i));importRun.point=p;if(elapsed>=duration){clearInterval(importRun.timer);importRun=null;state.imported=true;log('导入','收件文件夹',{文件数:docs.length,演示:'真实导入回放',实测耗时:data.elapsed});if(route()==='import')render();return;}if(route()==='import'){$('.progress>div').style.width=importRun.i/docs.length*100+'%';$('.progress').setAttribute('aria-valuenow',importRun.i);$('#progress-text').textContent=progressText();if(changed)$('#import-results').innerHTML=docTable(docs.slice(0,importRun.i));}};importRun.timer=setInterval(tick,50);tick();}
function markdown(text){const lines=esc(text).split('\n');let result='',list='';for(const line of lines){const match=line.match(/^\s*(-\s+|\d+\.\s+)(.*)$/),type=match?(match[1].trim()==='-'?'ul':'ol'):'';if(type!==list){if(list)result+=`</${list}>`;if(type)result+=`<${type}>`;list=type;}const value=(match?match[2]:line).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');result+=match?`<li>${value}</li>`:value?`<p>${value}</p>`:'<br>';}return result+(list?`</${list}>`:'');}
function fileActions(d){if(!canAccess(d))return '';if(!canDownload(d))return '<div class="notice">🔒 L4 绝密：仅限在线查看，禁止下载</div>';return `<div class="toolbar"><button data-action="file" data-id="${esc(d.id)}" data-kind="打开原文件">打开原文件</button><button data-action="file" data-id="${esc(d.id)}" data-kind="下载原文件">下载原文件</button></div>`;}
function citation(c,i){const d=docById(c.id)||c;if(!canAccess(d))return '';return `<details class="citation"><summary>[${i+1}] ${esc(c.title)} ${badge(c.level)}<span class="meta">${esc(c.dept)} / ${esc(c.doc_type)} / ${esc(rev(c.revision))} · <span class="badge ${c.is_latest?'current':'obsolete'}">${c.is_latest?'现行':'旧版本'}</span> · 相关度 ${Math.min(100,Math.max(0,Number(c.score)*100)).toFixed(0)}%</span></summary><p class="muted">${esc(c.archived_name)} · ${esc(c.doc_no)} · ${esc(c.doc_date)}</p>${(c.snippets||[]).map(s=>`<pre>${esc(s)}</pre>`).join('')}${c.version_info?`<div class="notice warning">${esc(typeof c.version_info==='object'?JSON.stringify(c.version_info):c.version_info)}</div>`:''}${fileActions(d)}</details>`;}
function deniedCards(entry){const denied=entry.denied||[];if(!denied.length)return '';const restricted=denied.filter(d=>!canAccess(docById(d.id)||d));return `${restricted.length?`<div class="notice warning">🔒 另有 ${restricted.length} 份相关资料超出你的权限（内容已屏蔽，未提供给 AI）</div>`:''}${denied.map(d=>{const full=docById(d.id)||d;return canAccess(full)?`<div class="notice success">${badge(d.level)} · ${esc(d.doc_type)} · ${esc(d.dept)}部 —— ${hasGrant(full)?'已获批准：':'已有权限：'}可在线查看${canDownload(full)?'':'（仍禁止下载）'}</div>`:`<div class="notice warning">${badge(d.level)} · ${esc(d.doc_type)} · ${esc(d.dept)}部 —— ${esc(denial(d))}<div class="toolbar"><button data-action="apply" data-testid="apply-btn" data-id="${esc(d.id)}" data-question="${esc(entry.question)}">申请查看</button></div></div>`;}).join('')}`;}
function chatItem(h,index){if(!h.entry)return `<div class="chat-user">${esc(h.question)}</div><div class="notice">该问题的预录结果对应角色：${esc(h.roles.join('、'))}<div class="toolbar">${h.roles.map(r=>`<button data-action="switch" data-role="${esc(r)}">切换为${esc(r)}</button>`).join('')}</div></div>`;const e=h.entry;return `<div class="chat-user">${esc(e.question)}</div><article class="chat-answer"><div class="answer" id="answer-${index}">${markdown(e.answer.split('\n\n---\n')[0])}</div><button class="small" id="skip-${index}" data-action="skip" hidden>跳过动画</button><div class="answer-meta">预录结果 · 模型 ${esc(e.model)} · 本机离线运行</div><h3>📎 引用来源</h3>${(e.citations||[]).map(citation).join('')||'<p class="muted">此预录结果无引用来源</p>'}${deniedCards(e)}</article>`;}
function searchPage(){return `<div class="tabs" role="tablist" aria-label="检索方式"><button role="tab" aria-selected="${tab==='ai'}" class="${tab==='ai'?'selected':''}" data-action="tab" data-tab="ai">AI 问答</button><button role="tab" aria-selected="${tab==='keyword'}" class="${tab==='keyword'?'selected':''}" data-action="tab" data-tab="keyword">关键词/条件检索</button></div>${tab==='ai'?`<h3>试试这些问题</h3><p class="muted">选择预设问题，查看本机模型的真实预录结果。</p><div class="question-grid">${[...new Set(qa.map(q=>q.question))].map(q=>`<button data-testid="q-btn" data-action="question" data-question="${esc(q)}">${esc(q)}${qa.some(e=>e.question===q&&e.role===state.role)?'':'<small>可查看对应演示角色</small>'}</button>`).join('')}</div><label class="sr-only" for="question-input">在线演示提问</label><input id="question-input" disabled placeholder="在线演示版仅支持上方预设问题（答案为本机模型预录结果）"><div class="toolbar"><button class="small" data-action="clear-chat">清空对话</button></div><div id="chat-history">${history.map(chatItem).join('')}</div>`:keywordPage()}`;}
function options(values,current){return '<option value="">全部</option>'+values.map(v=>`<option value="${esc(v)}"${current===v?' selected':''}>${esc(v)}</option>`).join('');}
function keywordPage(){return `<div class="toolbar"><label class="keyword">关键词<input id="keyword" placeholder="搜索标题、文件名或摘要" value="${esc(filters.keyword)}"></label>${[['dept','部门'],['doc_type','类型'],['level','密级']].map(([k,v])=>`<label>${v}<select data-filter="${k}">${options([...new Set(docs.map(d=>d[k]))].sort(),filters[k])}</select></label>`).join('')}</div><label class="check"><input type="checkbox" id="latest"${filters.latest?' checked':''}>仅显示最新版本</label><div id="keyword-results">${keywordResults()}</div>`;}
function keywordResults(){const kw=filters.keyword.trim().toLocaleLowerCase();const matched=docs.filter(d=>(!filters.latest||!!d.is_latest)&&['dept','doc_type','level'].every(k=>!filters[k]||d[k]===filters[k])&&(!kw||['title','original_name','archived_name','summary'].some(k=>String(d[k]||'').toLocaleLowerCase().includes(kw))));const visible=matched.filter(d=>canAccess(d));return `<p>找到 ${visible.length} 份文件；另有 ${matched.length-visible.length} 份文件因权限不足未显示</p>${docTable(visible)}`;}
function ask(question){const e=qa.find(e=>e.question===question&&e.role===state.role);log('检索',question,{命中:e?.citations?.length||0,拒绝:(e?.denied||[]).filter(d=>!canAccess(docById(d.id)||d)).length});if(e){for(const d of e.denied||[])if(!canAccess(docById(d.id)||d))log('拒绝访问',d.id,denial(d),'拒绝');history.push({entry:e});}else history.push({question,roles:[...new Set(qa.filter(e=>e.question===question).map(e=>e.role))]});render();if(e)typeAnswer(history.length-1,e.answer.split('\n\n---\n')[0]);}
function stopTyping(){if(animation){cancelAnimationFrame(animation.frame);const el=document.getElementById('answer-'+animation.index);if(el)el.innerHTML=markdown(animation.text);const skip=document.getElementById('skip-'+animation.index);if(skip)skip.hidden=true;animation=null;}}
function typeAnswer(index,text){stopTyping();const el=document.getElementById('answer-'+index),skip=document.getElementById('skip-'+index),chars=Array.from(text);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;animation={index,text,start:performance.now(),frame:null};skip.hidden=false;el.textContent='';function tick(t){if(!animation)return;const progress=Math.min(1,(t-animation.start)/1000);el.textContent=chars.slice(0,Math.ceil(chars.length*progress)).join('');if(progress>=1){stopTyping();return;}animation.frame=requestAnimationFrame(tick);}animation.frame=requestAnimationFrame(tick);}

function approvalsPage(){const pending=state.requests.filter(r=>r.status==='待审批').sort((a,b)=>b.id-a.id),past=state.requests.filter(r=>r.status!=='待审批').sort((a,b)=>b.id-a.id);return `<div class="notice">生产环境对接企业微信审批流（模板消息 + 回调）</div><p class="muted">演示：所有角色均可尝试审批按钮，系统将校验审批权限。</p>${notice}${pending.map(r=>{const d=docById(r.doc_id);return `<section class="card"><h3>申请 #${r.id} · ${esc(r.requester_role)} / ${esc(r.requester_dept)}部</h3><p>资料编号 ${esc(r.doc_id)} · ${esc(d.doc_type)} · ${badge(d.level)}</p>${canAccess(d)&&canApprove(d)?`<p>${esc(d.title)}</p>`:''}<p>问题：${esc(r.question||'未填写')}</p><p>原因：${esc(r.reason||'未填写')}</p><p class="muted">申请时间：${esc(r.created_at)}</p><div class="toolbar"><button class="primary" data-testid="approve-btn" data-action="approve" data-id="${r.id}">通过</button><button data-testid="reject-btn" data-action="reject" data-id="${r.id}">驳回</button></div></section>`;}).join('')||'<div class="notice">暂无待审批申请</div><button data-testid="seed-request" data-action="seed">模拟：生产操作员申请查看 FKM 胶料配方</button>'}<h2>审批历史</h2>${plainTable(['申请编号','申请角色','申请部门','资料编号','类型','密级','问题','原因','状态','申请时间','审批时间','审批人'],past.map(r=>{const d=docById(r.doc_id);return [r.id,r.requester_role,r.requester_dept,r.doc_id,d.doc_type,d.level,r.question,r.reason,r.status,r.created_at,r.decided_at,r.decided_by_role];}))}`;}
function decide(id,approve){const r=state.requests.find(r=>String(r.id)===String(id));if(!r||r.status!=='待审批')return;const d=docById(r.doc_id);if(!canApprove(d)){notice=`<div class="notice error" role="alert">⛔ 无审批权限：该资料需由 ${esc(approver(d))} 审批</div>`;log('拒绝访问',r.id,'无审批权限','拒绝');}else{r.status=approve?'已通过':'已驳回';r.decided_at=now();r.decided_by_role=state.role;r.decided_by_dept=roleRule().dept;log(approve?'审批通过':'审批驳回',d.id,{申请编号:r.id});notice='<div class="notice success" role="status">审批结果已保存</div>';}render();}

function exportCSV(){if(!roleRule().can_view_audit)return;const keys=['id','ts','role','dept','user_name','action','target','detail','result'];const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[['编号','时间','角色','部门','姓名','操作','对象','详情','结果'],...filteredAudit().map(a=>keys.map(k=>typeof a[k]==='object'?JSON.stringify(a[k]):a[k]))].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='审计日志_'+now().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}

$('#apply-form').addEventListener('submit',event=>{event.preventDefault();if(!modalDoc)return;const reason=$('#apply-reason').value.trim();if(!reason){$('#apply-reason').setCustomValidity('请填写申请原因');$('#apply-reason').reportValidity();return;}if(canAccess(modalDoc)){$('#apply-dialog').close();return;}const r=createRequest(modalDoc,state.role,modalQuestion,reason);$('#apply-dialog').close();render();toast(`已提交申请 #${r.id}（演示：生产环境将推送至企业微信审批，由 ${approver(modalDoc)} 审批）`);});
$('#apply-reason').addEventListener('input',()=>$('#apply-reason').setCustomValidity(''));
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||!data)return;const a=el.dataset.action;if(a==='import')startImport();else if(a==='question')ask(el.dataset.question);else if(a==='switch')switchRole(el.dataset.role);else if(a==='tab'){tab=el.dataset.tab;render();}else if(a==='clear-chat'){history=[];render();}else if(a==='skip')stopTyping();else if(a==='apply')openApply(el.dataset.id,el.dataset.question||'');else if(a==='close-dialog')$('#apply-dialog').close();else if(a==='approve'||a==='reject')decide(el.dataset.id,a==='approve');else if(a==='seed'){const d=docs.find(d=>d.doc_type==='胶料配方');if(d){const r=createRequest(d,'生产操作员/新员工','FKM 黑色胶料配方是什么？','演示：工作需要，申请在线查阅');notice=`<div class="notice success">已提交申请 #${r.id}，由 ${esc(approver(d))} 审批。</div>`;render();}}else if(a==='file'){const d=docById(el.dataset.id);if(d&&canDownload(d)){log('查看',d.id,el.dataset.kind);toast('在线演示版不含原文件','');}}else if(a==='csv')exportCSV();else if(a==='reset'){if(importRun)clearInterval(importRun.timer);importRun=null;stopTyping();state=fresh();history=[];notice='';auditGuard='';filters={keyword:'',dept:'',doc_type:'',level:'',latest:true};auditFilters={action:'',role:''};tab='ai';try{sessionStorage.removeItem(KEY);}catch{}$('#apply-dialog').close();render();toast('演示会话已重置');}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='role-select')switchRole(el.value);else if(el.dataset.filter){filters[el.dataset.filter]=el.value;$('#keyword-results').innerHTML=keywordResults();}else if(el.id==='latest'){filters.latest=el.checked;$('#keyword-results').innerHTML=keywordResults();}else if(el.dataset.auditFilter){auditFilters[el.dataset.auditFilter]=el.value;$('#audit-results').innerHTML=auditTable(filteredAudit());}});
document.addEventListener('input',event=>{if(event.target.id==='keyword'){filters.keyword=event.target.value;$('#keyword-results').innerHTML=keywordResults();}});
$('#mobile-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#mobile-toggle').setAttribute('aria-expanded',open);});
window.addEventListener('hashchange',()=>{notice='';$('#sidebar').classList.remove('open');$('#mobile-toggle').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);});
function fitBanner(){document.documentElement.style.setProperty('--banner-height',$('.banner').getBoundingClientRect().height+'px');}window.addEventListener('resize',fitBanner);fitBanner();
(async()=>{try{const loaded=await Promise.all(['./data/import.json','./data/qa.json'].map(async path=>{const response=await fetch(path);if(!response.ok)throw new Error('数据文件读取失败');return response.json();}));data=loaded[0];if(!Array.isArray(data.documents)||!data.roles||!data.levels||!Array.isArray(data.audit)||!Array.isArray(data.progress)||!Array.isArray(loaded[1]))throw new Error('数据格式无效');docs=data.documents;qa=loaded[1].filter(e=>e.ok===true);if(!Object.hasOwn(data.roles,state.role))state.role='总经理';state.requests=state.requests.filter(r=>docById(r.doc_id)&&data.roles[r.requester_role]);render();}catch{$('#main').innerHTML='<h1>示例数据暂时无法读取</h1><div class="notice error" role="alert">请确认 data/import.json 与 data/qa.json 和网页一同发布，并通过 HTTP 服务或 GitHub Pages 打开本页。检查后刷新页面重试。</div>';}})();
</script>
</body>
</html>
